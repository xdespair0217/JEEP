<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeep 越野專業保養與技術文獻看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c100d; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #141a15; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2d382e; border-radius: 3px; }
        .active-row { background-color: #1a231c !important; border-left: 4px solid #48683e !important; }
        .active-card { border-color: #48683e !important; background-color: #1e2920 !important; transform: scale(1.02); }
        .nav-tab-active { background-color: #15803d !important; color: #ffffff !important; border-color: #22c55e !important; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col p-6 relative">

    <!-- 頂部標頭列與主要導覽頁籤 -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center border-b border-emerald-950/60 pb-4 mb-4 gap-4">
        <div class="flex items-center space-x-6 shrink-0">
            <!-- Jeep 越野軍綠風格標誌 -->
            <div class="w-12 h-12 bg-emerald-800 border-2 border-emerald-600 rounded-lg flex items-center justify-center font-black text-white text-xs tracking-widest shadow-md shadow-emerald-950/50">JEEP</div>
            
            <!-- 大頁籤導覽 (Main Views Navigation) -->
            <nav class="flex bg-[#141a15] p-1 rounded-xl border border-emerald-900/80">
                <button onclick="switchMainView('package-view')" id="nav-package-view" class="px-5 py-2 rounded-lg text-xs font-bold transition-all nav-tab-active flex items-center space-x-2">
                    <span>🛠️ 保養套餐看板</span>
                </button>
                <button onclick="switchMainView('docs-view')" id="nav-docs-view" class="px-5 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center space-x-2">
                    <span>📚 技術文獻資料庫</span>
                </button>
            </nav>
        </div>
        
        <!-- 【套餐視圖專用】車型與套餐切換鈕 -->
        <div id="package-controls" class="flex flex-wrap items-center gap-4">
            <div class="flex items-center space-x-2">
                <label for="car-model-select" class="text-xs text-emerald-500/80 font-bold">目前車型：</label>
                <select id="car-model-select" onchange="switchCarModel(this.value)" class="bg-[#141a15] text-white border border-emerald-800 rounded px-2 py-1 text-sm font-bold focus:outline-none focus:border-emerald-500 cursor-pointer">
                </select>
            </div>
            <div id="package-tabs" class="flex flex-wrap gap-2">
                <span class="text-sm text-gray-500">正在辨識套餐...</span>
            </div>
        </div>

        <button onclick="reloadCurrentData()" class="bg-[#141a15] hover:bg-emerald-950 text-gray-300 hover:text-white text-xs px-4 py-2 rounded-lg transition-all border border-emerald-800/80 flex items-center space-x-1.5 shrink-0">
            <span>🔄</span> <span>同步雲端資料</span>
        </button>
    </header>

    <!-- ========================================================== -->
    <!-- 視圖一：保養套餐看板 (Package View) -->
    <!-- ========================================================== -->
    <main id="package-view" class="flex-1 flex space-x-6 overflow-hidden">
        <!-- 左側：保養套餐表格 -->
        <section class="w-7/12 flex flex-col bg-[#141a15] rounded-xl border border-emerald-950 p-5 overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 id="current-package-title" class="text-lg font-bold text-emerald-400 flex items-center">
                    <span class="w-2 h-5 bg-emerald-600 inline-block mr-2 rounded-sm"></span>連線成功，正在排版中...
                </h2>
                <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-semibold">連線正常</span>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-emerald-900/60 text-emerald-500/80 text-xs bg-[#0c100d]">
                            <th class="p-3 rounded-l-md">屬性</th>
                            <th class="p-3">料號</th>
                            <th class="p-3">項目名稱</th>
                            <th class="p-3 text-right">單價</th>
                            <th class="p-3 text-right">數量</th>
                            <th class="p-3 text-right">打折</th>
                            <th class="p-3 text-right">加總</th>
                            <th class="p-3 text-center rounded-r-md">層架</th>
                        </tr>
                    </thead>
                    <tbody id="table-rows"></tbody>
                </table>
            </div>

            <!-- 工資零件小計區 -->
            <div class="border-t border-emerald-950 pt-4 mt-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-xs text-gray-400">
                <div class="flex flex-wrap space-x-6">
                    <div>工資小計：<span id="labor-subtotal" class="font-bold text-gray-200 font-mono">$ 0</span></div>
                    <div class="border-l border-emerald-900/60 pl-6">零件原價：<span id="parts-original-total" class="font-bold text-gray-200 font-mono">$ 0</span></div>
                    <div class="border-l border-emerald-900/60 pl-6">零件折後：<span id="parts-subtotal" class="font-bold text-amber-500 font-mono">$ 0</span></div>
                </div>
                <div class="flex items-center space-x-2 bg-[#0c100d] border border-emerald-900/80 rounded-lg px-3 py-1.5 shrink-0">
                    <span class="text-[11px] text-emerald-500/80 font-bold">🛠️ 折扣：</span>
                    <input type="number" id="part-discount-input" value="100" min="0" max="100" step="5" oninput="calculateTotalsWithDiscount()" class="w-12 bg-[#141a15] text-center text-white text-xs font-bold border-b border-emerald-500 font-mono">
                    <span class="text-[11px] text-gray-300 font-bold">%</span>
                </div>
            </div>

            <div class="border-t border-emerald-950 pt-3 mt-2 flex justify-between items-center">
                <span class="text-gray-400 text-sm font-medium">套餐應付總金額</span>
                <span id="package-total" class="text-3xl font-black text-emerald-400 font-mono tracking-tight">$ 0</span>
            </div>
        </section>

        <!-- 右側：零件圖片展示牆 -->
        <section class="w-5/12 flex flex-col space-y-4 overflow-hidden">
            <div class="flex-1 bg-[#141a15] rounded-xl border border-emerald-950 p-5 flex flex-col overflow-hidden shadow-2xl">
                <h3 class="text-sm font-semibold text-emerald-500/80 mb-4 tracking-wider">🚙 套餐內含越野零件圖解</h3>
                <div id="image-grid" class="flex-1 grid grid-cols-2 gap-4 overflow-y-auto custom-scrollbar p-1 align-content-start"></div>
            </div>
            <div class="h-28 bg-[#141a15] rounded-xl border border-emerald-950 p-4 flex flex-col justify-center">
                <h4 class="text-xs font-bold text-amber-500 mb-1">🏜️ 越野保養維護提示</h4>
                <p class="text-xs text-gray-400 leading-relaxed">請技師依據 Jeep 原廠維修手冊程序執行更換，完工後請執行傳動檢測與 OBD 歸零。</p>
            </div>
        </section>
    </main>

    <!-- ========================================================== -->
    <!-- 視圖二：技術文獻資料庫 (Technical Docs View) -->
    <!-- ========================================================== -->
    <main id="docs-view" class="flex-1 flex space-x-6 overflow-hidden hidden">
        <!-- 左側：技術檔案清單 -->
        <section class="w-5/12 flex flex-col bg-[#141a15] rounded-xl border border-emerald-950 p-5 overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-emerald-900/60">
                <h2 class="text-lg font-bold text-emerald-400 flex items-center">
                    <span class="w-2 h-5 bg-emerald-600 inline-block mr-2 rounded-sm"></span>Jeep 原廠 TSB與技術手冊
                </h2>
                <span id="doc-count-badge" class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold">0 份文件</span>
            </div>

            <!-- 文件對應列表 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3" id="docs-list-container">
                <!-- 由 JavaScript 自動帶入 PDF 清單 -->
            </div>
        </section>

        <!-- 右側：PDF 檢視器與關聯圖解 -->
        <section class="w-7/12 flex flex-col bg-[#141a15] rounded-xl border border-emerald-950 p-5 overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 id="doc-viewer-title" class="text-sm font-bold text-emerald-400 truncate">📄 請選擇左側文件進行預覽</h3>
                <a id="doc-external-btn" href="#" target="_blank" class="hidden text-xs bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-1 rounded border border-emerald-600 transition-all">在新分頁開啟 PDF ↗</a>
            </div>

            <!-- PDF 內嵌容器 -->
            <div class="flex-1 bg-[#0c100d] rounded-lg border border-emerald-900/60 overflow-hidden relative flex items-center justify-center">
                <iframe id="pdf-frame" src="" class="w-full h-full border-none hidden"></iframe>
                <div id="pdf-placeholder" class="text-center p-8 text-gray-500">
                    <span class="text-4xl block mb-2">📑</span>
                    <p class="text-xs">點擊左側檔案標題即可在此預覽原廠手冊 PDF</p>
                </div>
            </div>

            <!-- 關聯零件綁定區 -->
            <div id="doc-linked-part-box" class="mt-3 p-3 bg-[#1e2920] border border-emerald-900 rounded-lg flex items-center justify-between hidden">
                <div class="flex items-center space-x-3">
                    <span class="text-xs text-amber-500 font-bold">🔗 本技術文件綁定零件：</span>
                    <span id="doc-linked-part-id" class="text-xs font-mono bg-[#0c100d] text-emerald-400 px-2 py-0.5 rounded border border-emerald-800"></span>
                </div>
                <button onclick="previewLinkedPartImg()" class="text-xs text-emerald-400 hover:underline">查看關聯零件圖解 🔍</button>
            </div>
        </section>
    </main>

    <!-- 高質感點擊燈箱彈出視窗 -->
    <div id="lightbox" onclick="closeLightbox()" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-4 cursor-zoom-out transition-opacity duration-300 opacity-0">
        <button class="absolute top-6 right-6 text-gray-400 hover:text-white text-4xl font-light focus:outline-none">&times;</button>
        <div class="max-w-4xl max-h-[80vh] flex items-center justify-center bg-[#141a15] p-2 rounded-lg border border-emerald-900 shadow-2xl" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="零件大圖" class="max-w-full max-h-[75vh] object-contain rounded">
        </div>
        <div class="mt-4 text-center max-w-xl" onclick="event.stopPropagation()">
            <p id="lightbox-part-id" class="text-xs text-emerald-500 font-mono tracking-widest"></p>
            <h3 id="lightbox-title" class="text-lg font-bold text-white mt-1"></h3>
        </div>
    </div>

    <script>
        // ==========================================================
        // 🎯【資料庫對照表】
        // ==========================================================
        const CAR_MODELS_SHEETS = {
            "WRANGLER RUBICON": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQVwsJ0KAnc5QTB8zzJ4Fqi9dSxDb-ANsUtWuOdP-X90_PR68pW-OpeJJlyYJbBAnkTGtG3bLrfSZL7/pub?gid=548899643&single=true&output=csv"
        };

        // 🔗【新技術文獻庫 CSV 連結】（請將發布後的 CSV 網址填入下方 quotes 內）
        const TECHNICAL_DOCS_URL = "https://docs.google.com/spreadsheets/d/e/YOUR_JEEP_SHEET_ID/pub?gid=YOUR_DOCS_GID&single=true&output=csv";

        let currentMainView = 'package-view';
        let allParsedPackages = {}; 
        let currentPackageKey = "";
        let selectedModel = Object.keys(CAR_MODELS_SHEETS)[0];
        let rawLaborSum = 0, rawPartsSum = 0;
        let activeLinkedPartId = "";

        // 大頁籤切換
        function switchMainView(viewId) {
            currentMainView = viewId;
            const packageView = document.getElementById('package-view');
            const docsView = document.getElementById('docs-view');
            const packageControls = document.getElementById('package-controls');
            
            const btnPackage = document.getElementById('nav-package-view');
            const btnDocs = document.getElementById('nav-docs-view');

            if (viewId === 'package-view') {
                packageView.classList.remove('hidden');
                docsView.classList.add('hidden');
                packageControls.classList.remove('hidden');
                btnPackage.className = "px-5 py-2 rounded-lg text-xs font-bold transition-all nav-tab-active flex items-center space-x-2";
                btnDocs.className = "px-5 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center space-x-2";
            } else {
                packageView.classList.add('hidden');
                docsView.classList.remove('hidden');
                packageControls.classList.add('hidden');
                btnPackage.className = "px-5 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center space-x-2";
                btnDocs.className = "px-5 py-2 rounded-lg text-xs font-bold transition-all nav-tab-active flex items-center space-x-2";
                fetchDocsData();
            }
        }

        function reloadCurrentData() {
            if (currentMainView === 'package-view') fetchSheetData();
            else fetchDocsData();
        }

        // --- 套餐視圖邏輯 ---
        function initCarModelSelect() {
            const selectEl = document.getElementById('car-model-select');
            selectEl.innerHTML = Object.keys(CAR_MODELS_SHEETS).map(model => `
                <option value="${model}" ${model === selectedModel ? 'selected' : ''}>${model}</option>
            `).join('');
        }

        function switchCarModel(modelName) {
            selectedModel = modelName;
            fetchSheetData();
        }

        async function fetchSheetData() {
            const targetUrl = CAR_MODELS_SHEETS[selectedModel];
            try {
                const response = await fetch(targetUrl + "&cachebust=" + new Date().getTime());
                const csvText = await response.text();
                parseExcelCSV(csvText);
            } catch (error) {
                console.error("抓取失敗:", error);
            }
        }

        function parseExcelCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const packages = {};
            let currentPackageName = ""; 

            lines.forEach((line) => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                if (cols.length < 3) return;

                const foundPackageCell = cols.find(cell => cell && cell.includes("套餐"));
                if (foundPackageCell) {
                    currentPackageName = foundPackageCell;
                    packages[currentPackageName] = { name: currentPackageName, items: [] };
                    return;
                }

                const attr = cols[0] || "", partId = cols[1] || "", name = cols[2] || "";
                if (currentPackageName && partId && partId !== "料號" && attr !== "屬性") {
                    const price = cols[3] || "", qty = cols[4] || "", discount = cols[5] || "", subtotal = cols[6] || "", location = cols[7] || "", description = cols[9] || "";
                    const cleanSubtotal = parseFloat(subtotal.replace(/[^0-9.-]+/g, "")) || 0;
                    packages[currentPackageName].items.push({ attr, partId, name, price, qty, discount, subtotal, cleanSubtotal, location, description });
                }
            });

            allParsedPackages = packages;
            const keys = Object.keys(allParsedPackages);
            if (keys.length > 0) { renderTabs(keys); switchPackage(keys[0]); }
        }

        function renderTabs(keys) {
            document.getElementById('package-tabs').innerHTML = keys.map(key => `
                <button onclick="switchPackage('${key}')" id="tab-${key}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#141a15] text-gray-400 hover:bg-emerald-950 border border-emerald-900 whitespace-nowrap">${key}</button>
            `).join('');
        }

        function switchPackage(key) {
            if (!allParsedPackages[key]) return;
            currentPackageKey = key;
            const pkg = allParsedPackages[key];
            document.getElementById('current-package-title').innerHTML = `<span class="w-2 h-5 bg-emerald-600 inline-block mr-2 rounded-sm"></span>${pkg.name}`;
            
            let tableHTML = '', gridHTML = '';
            rawLaborSum = 0; rawPartsSum = 0;

            pkg.items.forEach(item => {
                if (item.attr === "工資") rawLaborSum += item.cleanSubtotal;
                else rawPartsSum += item.cleanSubtotal;

                const attrBadgeClass = item.attr === "工資" ? "bg-slate-800 text-slate-300" : "bg-emerald-950/80 text-emerald-400 border border-emerald-800";
                tableHTML += `
                    <tr id="row-${item.partId}" class="border-b border-emerald-950 hover:bg-[#1e2920] transition-colors cursor-pointer text-xs" onclick="syncHighlight('${item.partId}')">
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${attrBadgeClass}">${item.attr}</span></td>
                        <td class="p-3 font-mono text-gray-300">${item.partId}</td>
                        <td class="p-3 text-white font-medium">${item.name}</td>
                        <td class="p-3 text-right font-mono text-gray-300">${item.price}</td>
                        <td class="p-3 text-right font-mono text-gray-300">${item.qty}</td>
                        <td class="p-3 text-right font-mono text-gray-400">${item.discount}</td>
                        <td class="p-3 text-right font-mono font-bold text-emerald-400">${item.subtotal}</td>
                        <td class="p-3 text-center font-mono text-amber-500 font-semibold">${item.location || '-'}</td>
                    </tr>`;

                if (item.attr !== "工資" && item.partId) {
                    const imgUrl = `${item.partId}.jpg`;
                    const defaultImg = "https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80";
                    gridHTML += `
                        <div id="card-${item.partId}" class="bg-[#1e2920] border border-emerald-900/60 rounded-lg p-3 flex flex-col items-center justify-between transition-all cursor-pointer hover:border-emerald-600 shadow-md" onclick="syncHighlight('${item.partId}')">
                            <div class="w-full h-28 bg-[#0c100d] rounded mb-2 flex items-center justify-center overflow-hidden relative group" onclick="openLightbox('${imgUrl}', '${item.partId}', '${item.name}', '${defaultImg}')">
                                <img src="${imgUrl}" alt="${item.name}" onerror="this.src='${defaultImg}'" class="object-contain w-full h-full p-1 opacity-85 group-hover:opacity-100 transition-opacity">
                            </div>
                            <div class="text-center w-full mt-1">
                                <p class="text-[10px] text-emerald-500/70 font-mono">${item.partId}</p>
                                <p class="text-xs text-white font-medium truncate">${item.name}</p>
                            </div>
                        </div>`;
                }
            });

            document.getElementById('table-rows').innerHTML = tableHTML;
            document.getElementById('image-grid').innerHTML = gridHTML;
            calculateTotalsWithDiscount();
        }

        function calculateTotalsWithDiscount() {
            let discountRate = parseFloat(document.getElementById('part-discount-input').value) || 100;
            const discountedPartsSum = Math.round(rawPartsSum * (discountRate / 100));
            document.getElementById('labor-subtotal').innerText = `$ ${rawLaborSum.toLocaleString()}`;
            document.getElementById('parts-original-total').innerText = `$ ${rawPartsSum.toLocaleString()}`;
            document.getElementById('parts-subtotal').innerText = `$ ${discountedPartsSum.toLocaleString()}`;
            document.getElementById('package-total').innerText = `$ ${(rawLaborSum + discountedPartsSum).toLocaleString()}`;
        }

        function syncHighlight(partId) {
            document.querySelectorAll('tr').forEach(el => el.classList.remove('active-row'));
            document.querySelectorAll('#image-grid > div').forEach(el => el.classList.remove('active-card'));
            const row = document.getElementById(`row-${partId}`);
            const card = document.getElementById(`card-${partId}`);
            if (row) row.classList.add('active-row');
            if (card) card.classList.add('active-card');
        }

        // --- 技術檔案庫專用邏輯 ---
        async function fetchDocsData() {
            const container = document.getElementById('docs-list-container');
            container.innerHTML = '<p class="text-xs text-gray-500 p-4">正在加載技術檔案資料庫...</p>';
            try {
                const response = await fetch(TECHNICAL_DOCS_URL + "&cachebust=" + new Date().getTime());
                const csvText = await response.text();
                parseDocsCSV(csvText);
            } catch (error) {
                container.innerHTML = '<p class="text-xs text-red-400 p-4">⚠️ 無法取得技術文件，請確認 CSV 網址設定。</p>';
            }
        }

        function parseDocsCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            let html = '';
            let count = 0;

            lines.forEach((line, index) => {
                if (index === 0) return; // 跳過標題列
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                if (cols.length < 3) return;

                const category = cols[0] || "通用檔案";
                const docId = cols[1] || "";
                const title = cols[2] || "";
                const pdfUrl = cols[3] || "#";
                const linkedPart = cols[4] || "";

                if (title) {
                    count++;
                    html += `
                        <div onclick="openPdfViewer('${pdfUrl}', '${title}', '${linkedPart}')" class="p-3 bg-[#1e2920] border border-emerald-900/60 hover:border-emerald-500 rounded-lg transition-all cursor-pointer shadow-md group">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-bold">${category}</span>
                                <span class="text-[10px] text-gray-500 font-mono">${docId}</span>
                            </div>
                            <h4 class="text-xs font-bold text-white group-hover:text-emerald-400 transition-colors">${title}</h4>
                            ${linkedPart ? `<p class="text-[10px] text-amber-500/80 mt-1">🔗 關聯料號：${linkedPart}</p>` : ''}
                        </div>
                    `;
                }
            });

            document.getElementById('doc-count-badge').innerText = `${count} 份文件`;
            document.getElementById('docs-list-container').innerHTML = html || '<p class="text-xs text-gray-500 p-4">目前無技術文件</p>';
        }

        function openPdfViewer(url, title, linkedPart) {
            const frame = document.getElementById('pdf-frame');
            const placeholder = document.getElementById('pdf-placeholder');
            const titleEl = document.getElementById('doc-viewer-title');
            const extBtn = document.getElementById('doc-external-btn');
            const linkedBox = document.getElementById('doc-linked-part-box');

            titleEl.innerText = `📄 ${title}`;
            extBtn.href = url;
            extBtn.classList.remove('hidden');

            frame.src = url;
            frame.classList.remove('hidden');
            placeholder.classList.add('hidden');

            activeLinkedPartId = linkedPart;
            if (linkedPart) {
                document.getElementById('doc-linked-part-id').innerText = linkedPart;
                linkedBox.classList.remove('hidden');
            } else {
                linkedBox.classList.add('hidden');
            }
        }

        function previewLinkedPartImg() {
            if (!activeLinkedPartId) return;
            const imgUrl = `${activeLinkedPartId}.jpg`;
            const defaultImg = "https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80";
            openLightbox(imgUrl, activeLinkedPartId, `技術文獻綁定零件 (${activeLinkedPartId})`, defaultImg);
        }

        // --- 燈箱邏輯 ---
        function openLightbox(imgSrc, partId, title, defaultImg) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imgSrc;
            lightboxImg.onerror = function() { this.src = defaultImg; };
            document.getElementById('lightbox-part-id').innerText = partId;
            document.getElementById('lightbox-title').innerText = title;
            lightbox.classList.remove('hidden');
            setTimeout(() => { lightbox.classList.remove('opacity-0'); }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 300);
        }

        // 初始化
        initCarModelSelect();
        fetchSheetData();
    </script>
</body>
</html>
